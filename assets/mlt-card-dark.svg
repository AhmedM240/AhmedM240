<svg xmlns="http://www.w3.org/2000/svg" width="400" height="180" viewBox="0 0 400 180" role="img" aria-labelledby="title desc">
<title id="title">MLT memory diagram</title>
<desc id="desc">A small memory diagram in the style MLT grades: the Globals frame holds nums, which points to a list [90, 85, 77] on the heap, and total = 252. Output: 252.</desc>
<defs><filter id="glow" x="-1" y="-1" width="3" height="3"><feGaussianBlur stdDeviation="2.5"/></filter></defs>
<style>@font-face{font-family:'Outfit';font-weight:600;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}.s{font-family:&quot;Outfit&quot;, -apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif}.m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace}.pulse{transform-box:fill-box;transform-origin:center;animation:pulse .6s ease-out both}@keyframes pulse{0%,100%{transform:scale(1)}40%{transform:scale(1.1)}}.pop{transform-box:fill-box;transform-origin:center;animation:pop .5s ease-out both}@keyframes pop{0%{transform:scale(.6)}50%{transform:scale(1.4)}100%{transform:scale(1)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<g transform="translate(0 4)">
<text x="28" y="24" class="m" font-size="10" font-weight="400" fill="#8B949E" text-anchor="start" letter-spacing="2">STACK</text>
<text x="212" y="24" class="m" font-size="10" font-weight="400" fill="#8B949E" text-anchor="start" letter-spacing="2">HEAP</text>
<line x1="196" y1="14" x2="196" y2="160" stroke="#3D444D" stroke-dasharray="3 4"/>
<rect x="28" y="34" width="152" height="94" rx="6" fill="none" stroke="#E6EDF3" stroke-width="1.5"/>
<text x="40" y="54" class="s" font-size="12.5" font-weight="600" fill="#E6EDF3" text-anchor="start">Globals</text>
<text x="84" y="80" class="m" font-size="11.5" font-weight="400" fill="#E6EDF3" text-anchor="end">nums</text>
<rect x="92" y="65" width="76" height="22" rx="4" fill="#161B22" stroke="#3D444D"/>
<circle cx="106" cy="76" r="4" fill="#2E8B8B"/>
<text x="84" y="110" class="m" font-size="11.5" font-weight="400" fill="#E6EDF3" text-anchor="end">total</text>
<rect x="92" y="95" width="76" height="22" rx="4" fill="#161B22" stroke="#3D444D"/>
<text x="100" y="110" class="m" font-size="11.5" font-weight="400" fill="#E6EDF3" text-anchor="start">252</text>
<rect x="212" y="34" width="164" height="72" rx="6" fill="none" stroke="#E6EDF3" stroke-width="1.5"/>
<text x="224" y="52" class="m" font-size="10.5" font-weight="400" fill="#8B949E" text-anchor="start">id:1</text>
<text x="256" y="52" class="s" font-size="12.5" font-weight="600" fill="#E6EDF3" text-anchor="start">list</text>
<text x="245" y="68" class="m" font-size="9.5" font-weight="400" fill="#8B949E" text-anchor="middle">0</text>
<rect x="224" y="72" width="42" height="24" rx="4" fill="#161B22" stroke="#3D444D"/>
<text x="245" y="88" class="m" font-size="11.5" font-weight="400" fill="#E6EDF3" text-anchor="middle">90</text>
<text x="293" y="68" class="m" font-size="9.5" font-weight="400" fill="#8B949E" text-anchor="middle">1</text>
<rect x="272" y="72" width="42" height="24" rx="4" fill="#161B22" stroke="#3D444D"/>
<text x="293" y="88" class="m" font-size="11.5" font-weight="400" fill="#E6EDF3" text-anchor="middle">85</text>
<text x="341" y="68" class="m" font-size="9.5" font-weight="400" fill="#8B949E" text-anchor="middle">2</text>
<rect x="320" y="72" width="42" height="24" rx="4" fill="#161B22" stroke="#3D444D"/>
<text x="341" y="88" class="m" font-size="11.5" font-weight="400" fill="#E6EDF3" text-anchor="middle">77</text>
<defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2E8B8B"/></marker></defs>
<path d="M106 76 C 160 76, 170 70, 209 70" fill="none" stroke="#2E8B8B" stroke-width="1.8" marker-end="url(#h)"/>
<text x="212" y="128" class="m" font-size="10" font-weight="400" fill="#8B949E" text-anchor="start" letter-spacing="2">OUTPUT</text>
<rect x="212" y="136" width="164" height="24" rx="4" fill="#161B22" stroke="#3D444D"/>
<text x="222" y="152" class="m" font-size="11.5" font-weight="400" fill="#E6EDF3" text-anchor="start">252</text>
</g>
</svg>
